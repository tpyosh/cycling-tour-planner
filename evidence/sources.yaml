  - id: evidence.mizunashi-hakodate-tide-cross-check
    subject: place.mizunashi-kaihin-onsen
    checked_at: 2026-08-30
    claims:
      - 気象庁の函館潮位表では、朝の干潮は9/24 08:15（26cm）、9/25 08:45（25cm）、9/26 09:13（26cm）、9/27 09:39（29cm）、9/28 10:03（35cm）と徐々に遅くなる
      - 夜の干潮は9/24 20:29（46cm）、9/25 21:01（36cm）、9/26 21:32（26cm）、9/27 22:04（19cm）、9/28 22:37（14cm）
      - 数値は函館地点の予測潮位であり、水無海浜温泉の現地潮位ではない。潮汐傾向の補助情報に限り、函館市の公式入浴可能時間を上書きしない
    volatility: low
    recheck_before_trip: false
    source: {type: official_reference, title: '気象庁「潮位表 函館」', url: 'https://www.data.jma.go.jp/kaiyou/data/db/tide/suisan/pdf_hilo/2026/HK.pdf'}
  - id: evidence.mizunashi-reopened-20260225
    subject: place.mizunashi-kaihin-onsen
    checked_at: 2026-08-30
    claims:
      - 2025年12月の大量のイワシ漂着により一時入浴禁止となったが、函館市の洗浄後、2026年2月25日から入浴を再開済み
      - 古い休止情報を前提にせず、旅行直前に函館市公式情報で運用状況を再確認する
    volatility: high
    recheck_before_trip: true
    source: {type: official, title: '函館市「水無海浜温泉の入浴再開について」', url: 'https://www.city.hakodate.hokkaido.jp/docs/2026021200036/'}
