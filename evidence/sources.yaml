      - 新北上大橋から神割崎周辺では比較的長いトンネルが連続し、国道45号は国道398号より交通量が多く、橋前後の狭い路肩や無信号の三陸道IC出入口に注意が必要と案内している
      - 大会時の運営車両による速度調整は2026-09-25の通常走行には存在しないため、大会コースであることだけで通常時の安全を保証しない
