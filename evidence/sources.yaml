  - id: evidence.mizunashi-facility
    subject: place.mizunashi-kaihin-onsen
    checked_at: 2026-08-30
    claims:
      - 所在地は北海道函館市恵山岬町
      - 函館市が管理する無料の海浜露天風呂
      - 無料駐車場20台、男女別更衣室あり、水着着用可
      - 泉温49.0℃、泉質はナトリウム－塩化物・硫酸塩温泉
      - 満潮時は浴槽が海中に没し、潮が引きすぎると海水による希釈が足りず熱すぎる場合がある
      - 函館市が潮位表を基に入浴可能時間を設定しているが、時間は目安であり、荒天や高波などでは入浴できない場合がある
    volatility: low
    recheck_before_trip: false
    source: {type: official, title: '函館市「水無海浜温泉」', url: 'https://www.city.hakodate.hokkaido.jp/docs/2014041800107/'}
  - id: evidence.mizunashi-2026-september-schedule
    subject: place.mizunashi-kaihin-onsen
    checked_at: 2026-08-30
    claims:
      - 2026年9月の函館市公式入浴可能時間表を旅程上の一次的な時間制約とする
      - 記載時間は潮汐上の入浴可能候補であり、入浴を保証するものではない
      - 入浴可能時間内でも波が高い日は入浴できない
    volatility: high
    recheck_before_trip: true
    source: {type: official_schedule, title: '函館市「2026年 水無海浜温泉入浴可能時間表」', url: 'https://www.city.hakodate.hokkaido.jp/docs/2014041800107/file_contents/mizunashi2026.pdf'}
