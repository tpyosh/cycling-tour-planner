schema_version: 1
hard:
  - id: travel-dates
    description: 2026年9月23日（水・祝）から9月28日（月）までの6日間とする
  - id: origin-and-return
    description: 名古屋発着とし、9月28日中に名古屋へ帰着する
  - id: solo-travel
    description: 大人1名の一人旅として交通・宿泊を組み立てる
  - id: no-rental-car
    description: レンタカーは使わず、JR、BRT、三陸鉄道、路線バス、船、自転車、必要時の短距離タクシーで組み立てる
  - id: no-bookings-yet
    description: 現時点では交通・宿泊・施設予約のいずれも確定扱いにしない
soft:
  - id: core-themes
    description: 東日本大震災、津波、震災遺構、復興、被災後の交通再編を旅の主題とする
  - id: transport-themes
    description: 気仙沼線BRT、大船渡線BRT、三陸鉄道を単なる移動ではなく交通体験として組み込む
  - id: regional-breadth
    description: 震災遺構だけに偏らず、漁港、水産業、市場、製鉄、地域史、生活文化、ローカルフード、珍スポット、商業施設、交通インフラ、地場産業、動線上の気になる場所も同程度に探索する
  - id: bicycle-role
    description: 自転車旅行だから全区間を自走するという思想は採用せず、走行自体の価値、点在候補を束ねる価値、純粋移動の3類型を区間ごとに判定して使う
  - id: avoid-low-value-roads
    description: 自転車で得られる付加価値が低い純粋移動区間でも、公共交通・輪行は、より良い立ち寄り先、滞在時間、経路、または旅程の余裕を新たに得られる場合に限って提案する
  - id: information-density
    description: 6日間の到達距離より情報密度を優先し、現行案は陸前高田を北端とする
  - id: reduce-bike-packing
    description: 気仙沼2連泊を置いて早朝市場と市街深掘りを両立しつつ、価値の低い接続区間では必要な輪行を受け入れる
  - id: cycling-capability
    description: 自転車は1日100km程度までを許容し、長い登り、グラベル、林道、押し歩き、担ぎにも対応できる
