common_phone_questions:
  - 2026年の対象日に、大人1名・1室・個室で泊まれるか
  - 希望プランと、税・サービス料・宿泊税を含む支払総額はいくらか
  - 現金のみか、カードまたはその他の決済を利用できるか
  - 夕食・朝食の有無と開始時刻は何時か
  - 自転車行程が遅れた場合、夕食に間に合う最終到着時刻は何時か
  - 自転車1台で旅行しているが、客室へ持ち込めるか
  - 客室持込み不可の場合、宿泊者以外が自由に出入りできない建物内で保管できるか
  - 屋内保管場所は施錠できるか
  - 輪行袋への収納または事前連絡が必要か
  - 最終チェックイン時刻は何時か
  - 無料キャンセル期限と、前日・当日のキャンセル料はいくらか

noboribetsu_policy:
  - 登別温泉の主要宿はオンライン販売が成熟しているため、既存Web調査を基本的に信用する
  - 価格または1名利用条件が合わなければ、stay.noboribetsuまたはstay.higashi-muroranのWeb予約可能なビジネスホテルを優先する
  - Web満室の大規模旅館へ裏在庫を期待して順番に電話しない
  - 公式が電話予約主体の小規模宿を新たに確認した場合だけ電話候補へ追加する
