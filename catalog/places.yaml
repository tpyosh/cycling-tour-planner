  - id: place.seikan-tunnel-museum
    name: 青函トンネル記念館
    kind: museum
    status: shortlisted
    map_query: 青函トンネル記念館
    description: 9/25の主役。体験坑道ツアー（集合8:50、体験9:00〜9:50）は予約済み。終了後、約22kmを自走して鉄道へ転場する。予約は竜飛斜坑線の出発便を指定するものではない。
    tags: [日別主役, 青函トンネル]
  - id: place.seikan-honshu-portal
    name: 青函トンネル本州側坑口
    kind: transport_site
    status: shortlisted
    map_query: 青函トンネル 本州側坑口
    description: 青函トンネル体験と直接つながる対象として、移動途中に短時間立寄り可。
    tags: [任意, 短時間]
  - id: place.osorezan
    name: 恐山
    kind: attraction
    status: shortlisted
    map_query: 恐山 菩提寺
    description: 9/26の最大級アンカー。9:00頃到着を目安に2時間〜2時間15分を確保し、短縮して旅程を成立させない。
    tags: [日別主役, 滞在優先]
  - id: place.oyakusen
    name: 奥薬研
    kind: hot_spring
    status: shortlisted
    map_query: 奥薬研温泉
    description: 15〜30分程度の可変立寄り。独立アンカーへ昇格させない。
    tags: [任意, 短時間]
  - id: place.old-ohata-station
    name: 旧大畑駅
    kind: historic_site
    status: shortlisted
    map_query: 旧大畑駅
    description: 10〜20分。実際の終着駅から、大間線未成区間へ自走で進む連続性を観察する。
    tags: [大間線, 鉄道史]
  - id: place.shimofuro
    name: 下風呂温泉・大間線未成線
    kind: hot_spring
    status: shortlisted
    map_query: 下風呂温泉 大間線 未成線
    description: 9/26の14時頃到着を目安に1.5時間程度を確保する。温泉街と未成線を対象とし、可能なら入浴する。
    tags: [大間線, 温泉]
  - id: place.oma-fishing-port
    name: 大間漁港
    kind: transport_site
    status: deferred
    map_query: 大間漁港
    description: 9/27第9便へ変更してまで観察する候補にはしない。水揚げは保証されず、予約済み第5便を固定する今回の計画では採用しない。
    tags: [優先度低, 現役漁業]
  - id: place.omazaki
    name: 大間崎
    kind: attraction
    status: shortlisted
    map_query: 大間崎
    description: 9/26夕方〜夜に回収する。9/27の交通選択には影響しない。
    tags: [短時間]
  - id: place.mashumaru
    name: 青函連絡船記念館 摩周丸
    kind: museum
    status: shortlisted
    map_query: 青函連絡船記念館 摩周丸
    description: 9/27第5便で函館08:20着後、朝一番に75〜90分を確保する。実船、船橋、無線通信室、車両航送システム、旧函館桟橋・可動橋主塔・岸壁を一つの鉄道連絡船システムとして見る。青函トンネル→現役大間フェリー→旧青函連絡船を結ぶ旅の交通史上の主役とする。
    tags: [日別主役, 青函]
  - id: place.old-soma-residence
    name: 旧相馬家住宅
    kind: historic_site
    status: shortlisted
    map_query: 旧相馬家住宅 函館
    description: 港湾商業で形成された商人資本が住宅・都市空間へどう現れたかを見る9/27昼の必須候補。閉館時刻を考慮し、50〜60分を優先して確保する。
    tags: [日別主役, 港湾商業]
  - id: place.hakodate-northern-peoples-museum
    name: 函館市北方民族資料館
    kind: museum
    status: shortlisted
    map_query: 函館市北方民族資料館
    description: アイヌ、ウイルタ、その他北方民族の実物資料を通じ、函館が北方世界・交易・研究の窓口だった文脈を見る9/27昼の必須候補。60〜75分。遅くまで開館する季節のため、進行が遅れた場合は夕方へ後ろ倒しできる。
    tags: [日別主役, 北方世界]
  - id: place.hakodate-west-port-observation
    name: 入舟・船入澗防波堤・函館どつく外周
    kind: transport_site
    status: shortlisted
    map_query: 入舟漁港 船入澗防波堤 函館どつく
    description: 入舟漁港、船入澗防波堤、漁港と住宅地の境界、古い港湾土木、現役造船所の外周と西端の土地利用を自転車で観察する一続きの区間。構内見学を前提にせず45〜90分の可変枠とする。
    tags: [日別主役, 港湾土木, 現役造船]
  - id: place.kakinoshima-site
    name: 垣ノ島遺跡
