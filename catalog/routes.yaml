    distance_km: null
    route_value: low
    tags: [current-prime, public-transport-priority, bicycle-bagging]
    description: 唐桑から陸前高田へ移る区間。自走に固定せず、路線バスや大船渡線BRTを含む公共交通との併用を選択肢にする。具体便、輪行可否、乗降地点は未確認。
