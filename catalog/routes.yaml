    tags: [current-prime, short-local-mobility]
    description: いわてTSUNAMIメモリアル、奇跡の一本松、タピック45、BRT奇跡の一本松駅と帰路の乗車地点を結ぶ短距離の足。大船渡線BRTは別の観光時間を取らず移動体験として回収する。
