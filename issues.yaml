schema_version: 1
items:
  - id: issue.mizunashi-arrival-window-20260924
    title: 9/24に水無海浜温泉の朝枠へ到着できるか未確認
    status: open
    priority: high
    category: schedule
    identified_at: 2026-08-30
    summary: 9/24の公式入浴可能時間は05:00〜11:00と19:00〜22:00だが、現在の旅程には水無海浜温泉への到着予想時刻がなく、優先する朝枠の中央寄りに到着できるか確認できない
    impact: 函館から水無海浜温泉までは80〜100kmで、旧戸井線と恵山への立ち寄りもある。朝枠を外すと夜枠が候補になるが、入浴後に鹿部まで25〜35kmを夜間走行する可能性がある
    related_dates: [2026-09-24]
    subjects:
      - place.mizunashi-kaihin-onsen
      - route.hakodate-toi-esan-mizunashi
      - route.mizunashi-shikabe
    evidence:
      - evidence.mizunashi-2026-september-schedule
    next_action: 9/24の函館出発時刻、各立ち寄りの所要時間、水無海浜温泉への到着予想時刻を置き、公式時間の開始・終了から30〜60分以上離れた朝枠内に収まるか確認する
    resolution_conditions:
      - 朝枠を使う場合、水無海浜温泉への到着予想時刻が05:00〜11:00の端から30〜60分以上離れている
      - 夜枠を予備に残す場合、日没後の入浴環境と鹿部までの夜間走行を許容するか判断済みである
      - 公式時間内でも荒天・高波で入浴できないことを当日の最終判断条件として残している
    resolution: null
