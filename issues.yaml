schema_version: 1
items:
  - id: issue.mizunashi-arrival-window-20260924
    title: 9/24の水無海浜温泉への到着時刻を要確定
    status: open
    priority: high
    category: schedule
    identified_at: 2026-08-30
    summary: 9/24は水無海浜温泉の朝枠を最優先とし、函館から約52kmの恵山非経由ルートで05:00〜11:00の朝枠を目指す方針だが、函館出発時刻と到着予想時刻は未確定である
    impact: 朝枠を外すと19:00〜22:00の夜枠が候補になるが、暗い岩場での入浴と、その後に南茅部経由で鹿部まで走る行程は現実的でない。朝枠に余裕を持って到着できない場合は入浴を見送る必要がある
    related_dates: [2026-09-24]
    subjects:
      - place.mizunashi-kaihin-onsen
      - route.hakodate-toi-mizunashi
      - route.mizunashi-shikabe
    evidence:
      - evidence.mizunashi-2026-september-schedule
    next_action: 9/24の函館出発時刻と水無海浜温泉への到着予想時刻を先に確定し、公式時間の終了から30〜60分以上余裕を確保する。旧戸井線アーチ橋は、その余裕を維持できる場合だけ見学時間を置く
    resolution_conditions:
      - 朝枠を使う場合、水無海浜温泉への到着予想時刻が05:00〜11:00の端から30〜60分以上離れている
      - 水無海浜温泉への到着前の立ち寄りは、朝枠への余裕を損なわない場合に限られている
      - 朝枠に収まらない場合は入浴を見送り、夜枠を前提とした鹿部までの夜間行程を組まない
      - 公式時間内でも荒天・高波で入浴できないことを当日の最終判断条件として残している
    resolution: null
