  - id: issue.tappi-museum-okutsugaru-connection
    title: 9/25 体験坑道の朝一枠確保と奥津軽いまべつへの接続
    status: open
    priority: high
    category: schedule
    identified_at: '2026-09-20'
    summary: 9/25のじゃらんでは、集合8:50・体験9:00〜9:50の即時予約可能な枠を確認した。これは朝一の予約枠が表示されることの確認であり、9:00始発便への乗車保証は未確認である。始発が保証されない場合は、施設の割当方法と受付期限を確認する必要がある。通常の次便である9:50発を想定した9:40集合・9:50〜10:40枠は、22kmの自走を15km/hで約1時間30分と置くと、奥津軽いまべつ13:35発までに輪行準備・駅内移動・乗車余裕を約1時間25分残せる実用的なフォールバック候補である。10:40〜11:30枠は同じ前提で余裕が約35分となるため、安全なフォールバックには数えない。
    impact: 主役を削らず下北へ鉄道転場できるかの前提になる。
    related_dates: ['2026-09-25']
    subjects: [place.seikan-tunnel-museum, route.tappi-okutsugaru, transport.hayabusa24]
    evidence: [evidence.seikan-tunnel-museum-operation-20260925, evidence.seikan-tunnel-museum-20260925, evidence.seikan-tunnel-museum-contact-20260925, evidence.tappi-okutsugaru-rider-record-20201105, evidence.okutsugaru-shimokita-20260925]
    dependencies: [issue.tappi-lodging]
    next_action: User Action `action.tappi-museum-booking` の予約結果と施設回答を受け、確定した体験終了時刻から奥津軽いまべつ13:35発へ輪行完了で到着する時系列を検証する。出発前の運行状況、最新時刻表、道路・天候の確認は別途User Actionとして扱う。
    resolution_conditions:
      - じゃらんの「集合8:50／体験9:00〜9:50」を予約した場合に、9:00始発便への乗車が保証されるか施設から確認する
      - 保証されない場合に、始発便の割当方法と必要な受付期限を施設から確認する
    resolution: null
  - id: issue.okutsugaru-rail-operation
    title: 9/25 奥津軽いまべつからむつの鉄道接続
    status: resolved
    priority: high
    category: schedule
    identified_at: '2026-09-20'
    summary: 2026年9月の通常ダイヤで、はやぶさ24号は奥津軽いまべつ13:35発→八戸14:15着、快速しもきた3233Dは八戸15:14発→下北16:47着である。八戸の乗換時間は59分で、通常ダイヤ上の接続成立性は確認済みである。
    impact: 弱い長距離自走を避け、むつ泊と翌日の恐山起点を守れるかに影響する。
    related_dates: ['2026-09-25']
    subjects: [transport.hayabusa24, transport.shimokita3233d, stay.mutsu]
    evidence: [evidence.okutsugaru-shimokita-20260925, evidence.shimokita3233d-20260925]
    dependencies: [issue.tappi-museum-okutsugaru-connection]
    next_action: 当日朝に運休・大幅遅延の有無をPreflightで確認する。奥津軽いまべつ13:35発までの自走・輪行準備は issue.tappi-museum-okutsugaru-connection で扱う。
    resolution_conditions: [通常ダイヤ上の奥津軽いまべつ→八戸→下北の接続時刻を確認する]
    resolution: 2026年9月の通常ダイヤで奥津軽いまべつ13:35→八戸14:15、八戸15:14→下北16:47を確認し、八戸で59分の乗換時間があるため、通常ダイヤ上の鉄道接続は成立すると整理した。当日の運休・大幅遅延はPreflightへ移した。
