  - id: issue.oma-morning-ferry-timeline
    title: 9/27 大間と函館の時間配分（第5便・第9便の選択）
    status: resolved
    priority: high
    category: schedule
    identified_at: '2026-09-20'
    summary: 第5便をPrimeとして予約する。第9便の追加価値は、7〜9時頃の大間漁港で延縄船の帰港・水揚げに遭遇できるかに集中するが、水揚げは不確実である。第5便は摩周丸を主役に、未訪の函館港・朝市・漁港・造船所外縁を港湾・漁業・交通史の行動として束ねられる。
    impact: 第5便は午前〜午後の価値が複数の行動に分散し、下振れが小さい。第9便は一点突破の上振れが大きいが、強い現地情報がない限り採用しない。
    related_dates: ['2026-09-27']
    subjects: [place.oma-fishing-port, place.mashumaru, transport.oma-hakodate-0650, transport.oma-hakodate-1340]
    evidence: [evidence.oma-hakodate-0650-20260927]
    dependencies: []
    next_action: 第5便を予約し、予約商品ごとの変更条件を確認する。第9便への変更条件は plan/current.yaml の contingency.oma-morning-fishing で管理する。
    resolution_conditions:
      - 第5便・第9便の具体的な体験の差分を比較する
      - 第5便をPrimeとして選択し、第9便の再検討条件を限定する
    resolution: 第5便（大間06:50→函館08:20）をPrimeとして予約する。大間崎・町・港・マグロ料理は9/26夕方〜夜に回収できるため第9便の追加価値には数えず、翌朝の帰港・水揚げに関する強い現地情報が自然に得られた場合だけ第9便を再検討する。漠然と大間に長くいたいという理由や、漁協への観光目的の照会では変更しない。
