schema_version: 1
status: working
recommendations:
  - 現在のPrimeは五所川原→竜飛→むつ→大間→函館と前進する5泊6日案である。
  - 固定交通時刻と、自走から置いた到着目安を区別して記録する。
weather_climate:
  forecast_snapshot:
    retrieved_at: '2026-09-22T13:30:00+09:00'
    sources:
      - title: Weathernews 天気図（9/22 10:47更新）
        url: https://weathernews.jp/onebox/chart/?fm=header
        checked_at: '2026-09-22'
        volatility: high
      - title: 気象庁 週間天気予報・防災気象情報
        url: https://www.jma.go.jp/bosai/forecast/
        checked_at: '2026-09-22'
        volatility: high
    synoptic_context:
      - kind: fact
        text: 台風25号は日本の東海上を北東進し、日本から離れる方向。大陸側から張り出す高気圧の影響で、東北北部は旅行前半に晴れ基調と見込まれていた。一方、26日ごろ以降は雨域が再び広がる可能性が示されていた。
      - kind: inference
        text: 前半は比較的安定、後半は次の気圧配置次第。9/27と9/28のどちらに雨が寄るかはソース間で揺れており、どちらかを雨と確定しない。
    days:
      - date: '2026-09-23'
        route_label: 名古屋→五所川原
        facts:
          - 龍飛は23/12℃・晴れ時々曇・降水20%、むつは25/15℃・概ね晴れ。
        interpretation:
          - 長距離自走日ではなく、天候由来の大きなブロッカーは見えていない。
        recheck_focus:
          - 夜は10℃台前半まで下がる可能性があるため、防寒を残す。
      - date: '2026-09-24'
        route_label: 五所川原→十三湖→小泊→龍泊ライン→竜飛
        facts:
          - 龍飛崎の9/22 12:00発表予報は、曇時々晴・24/14℃・降水確率40%・予想降水量0 mm、昼前後に西風約5 m/s。
        interpretation:
          - 現状は雨天中止を考える状況ではない。龍泊ラインは海沿い〜高所の露出区間を含むため、降水確率より風向・風速を直前確認する価値が高い。5 m/sは異常な強風ではないが、上りの速度、尾根部、下りの体感温度に影響し得る。
        recheck_focus:
          - 9/23夜に09:00〜16:00頃の龍飛崎の時間帯別風向・風速・降水を確認する。
      - date: '2026-09-25'
        route_label: 竜飛→青函トンネル体験坑道→奥津軽いまべつ→八戸→下北→むつ
        facts:
          - 龍飛は晴時々曇・21/11℃・降水20%、むつは晴れたり曇ったり・22/13℃。
        interpretation:
          - 鉄道移動比率も高く、現時点の気象リスクは小さい。
        recheck_focus:
          - 龍飛の早朝は11℃前後まで下がる見込みのため、防寒を要する。
      - date: '2026-09-26'
        route_label: むつ→恐山→薬研→大畑→下風呂→大間
        facts:
          - むつは20/15℃・所により晴れ、大間は曇のち晴・22/14℃・降水20%。
        interpretation:
          - 大間側の予報は悪天候を示していない。市街地の最高気温だけで判断せず、恐山方面の標高と下りの体感温度を含める。
        recheck_focus:
          - 9/25夜に恐山周辺の気温・降水・風と、下りの体感温度を確認する。
      - date: '2026-09-27'
        route_label: 大間→津軽海峡フェリー→函館
        facts:
          - 大間は晴時々曇・23/17℃・降水20%、函館は曇のち晴・23/17℃・降水40%。別系統のむつ周辺予報はにわか雨・22/14℃。
        interpretation:
          - 9/27は雨と確定する段階ではない。低気圧・前線の通過タイミングが1日程度ずれる可能性を残し、現在の降水予報からフェリー運航可否を推測しない。予約済みの06:50大間発・08:20函館着を変更する材料にはなっていない。
        recheck_focus:
          - 9/26夜と9/27朝に大間・津軽海峡の風・波・警報と、津軽海峡フェリー公式運航情報を確認する。
      - date: '2026-09-28'
        route_label: 函館→名古屋
        facts:
          - 函館は雨のち晴・23/17℃・降水60%。
        interpretation:
          - 取得時点のForecast snapshotでは、旅行中の本格的な雨リスクが最も表面化しているのは9/28朝。ただし5〜6日先であり、降雨時間帯は固定的に扱わない。
        recheck_focus:
          - 9/27夜に函館朝市〜新函館北斗への移動に影響する降雨時間帯を確認する。
  climate_baseline:
    period: 1991–2020
    sources:
      - title: 気象庁 過去の気象データ検索（平年値）
        url: https://www.data.jma.go.jp/stats/etrn/
        checked_at: '2026-09-22'
        volatility: low
    stations:
      - name: 五所川原
        values: [平均気温19.5℃, 日最高気温平均24.6℃, 日最低気温平均15.0℃, 月降水量133.9 mm, 平均風速1.8 m/s]
        interpretation: 内陸側の基準地点。
      - name: 蟹田（津軽海峡側の海岸環境の参考）
        values: [平均気温18.7℃, 日最高気温平均23.2℃, 日最低気温平均14.3℃, 月降水量161.2 mm, 平均風速2.9 m/s]
        interpretation: 五所川原より海岸側の平均風速が明確に高く、沿岸・露出区間では風を別途評価する。
      - name: 大間
        values: [平均気温19.5℃, 日最高気温平均22.8℃, 日最低気温平均16.0℃, 月降水量149.0 mm, 平均風速2.5 m/s]
        interpretation: 海峡横断前後も風と体感温度を独立して扱う。
      - name: むつ
        values: [月降水量163.8 mm, 1 mm以上の降水日約10.2日/月]
        interpretation: 9月中に雨域が一度通過しても不自然ではない。
      - name: 函館
        values: [平均気温18.8℃, 月降水量150.5 mm, 1 mm以上の降水日約10.2日/月]
        interpretation: 海峡を渡っても連日乾燥・安定とは前提にしない。
    interpretation:
      - 9月下旬の津軽海峡周辺は秋晴れが期待できる季節ではあるが、連日乾燥して安定する季節と考えるのは不適切である。
      - 月の約1/3で1 mm以上の降水がある地点もあり、今回の6日間に一度雨域が通過すること自体は気候的に不自然ではない。
  seasonal_outlook:
    issued_at: '2026-09-17'
    sources:
      - title: 気象庁 向こう2週間・1か月の予測資料
        url: https://www.data.jma.go.jp/risk/probability/
        checked_at: '2026-09-22'
        volatility: medium
    claims:
      - kind: fact
        text: 9/17発表の1か月予報では、東北・北海道とも平均気温が「高い」確率70%とされた。
      - kind: inference
        text: 2026年9月下旬は、平年より暖かい側に振れる可能性が高い。
    application:
      - これは夏装備でよいという意味ではない。短期予報でも龍飛11〜14℃、むつ13〜15℃、大間14〜17℃の最低気温が出ている。
      - 朝、風のある海岸、高所、長い下りは十分に秋の気温として扱い、防風・防寒装備を削る根拠にはしない。
  operational_summary:
    - 9/23〜26には現時点で大きな降雨ブロッカーは見えていない。9/24龍泊ラインと9/26下北縦断も、現行Primeを崩す予報ではない。ただし9/24龍飛は雨より風を注視する。
    - 9/27〜28は次の気圧変化のタイミングが不安定で、予報ソース間に差がある。現時点では9/28函館の雨予報が比較的強いが、9/27側への前倒し・後ろ倒しの可能性を残す。
    - 2026年として平年より暖かい傾向でも、津軽海峡沿岸の朝晩は10℃台前半〜半ば。風や下りを含めれば、防風・防寒装備を削る根拠にはならない。
  update_policy: 予報を更新するときはforecast_snapshotを現在有効な内容へ置換し、古い予報を追記しない。climate_baselineは平年値、User Action Dashboardは未完了の直前確認だけを現在状態として保つ。天気予報だけを理由にPrime旅程・アンカーを変更しない。
days:
  - date: '2026-09-23'
    start: 自宅（金山駅徒歩約6分）
    finish: 五所川原
    self_riding: {distance_km: {min: 0, max: 0}}
    routes: []
    transport: [transport.tokaido-kanayama-nagoya-0558, transport.nozomi288, transport.hayabusa7, transport.ouu-shin-aomori-kawabe, transport.gono-kawabe-goshogawara]
    transport_alternatives: [transport.resort-shirakami4-kawabe-goshogawara]
    visits: [place.tachineputa]
    optional_visits: []
    food: []
    stay: {preferred: [stay.goshogawara], fallback: []}
    notes:
      - '05:15に自宅（金山駅徒歩約6分）を出発し、05:21頃に金山駅へ到着する。駅付近で05:21〜05:31に自転車を輪行状態にする（標準所要10分）。'
      - '05:31〜05:45頃に改札を通過し、エレベーター等を使ってJRホームへ移動する。金山駅ホームの到達目標は05:45とし、05:45〜05:58の13分は輪行作業の遅れや荷物を持つ構内移動を吸収する安全余裕とする。'
      - '05:58発のJR東海道本線で金山→名古屋06:04。名古屋では06:04〜06:15に在来線ホームから東海道新幹線15番線へ移動し、06:15頃の新幹線ホーム到達を目標とする。06:15〜06:28の13分は号車位置確認と輪行袋を持った移動を含む乗車余裕とする。'
      - '05:58発は予約済みのぞみ288号へ安全に乗るためのクリティカル列車であり、理論上の最遅時刻ではない。これを逃した時点でbaselineから逸脱するため、金山06:15発→名古屋06:21着を通常のバックアップとしては記載せず、その場で最速経路を再検索する。'
      - 固定交通は予約済みのぞみ288号（名古屋06:28・15番線発→東京08:03・19番線着）とはやぶさ7号（東京08:37、22番線発→新青森11:51）。東京の乗換は34分あり、はやぶさ7号は新青森11:53発で新函館北斗まで直通するため、新青森到着前に輪行荷物をまとめて降車する。
      - 新青森12:20発・2番線の奥羽本線普通654M（弘前行）で川部12:49着、川部12:56発の五能線普通2828D（深浦行）で五所川原13:24着。新青森の乗換は29分あり余裕がある。
      - 川部では654Mの12:49着から2828Dの12:56発まで7分。通常運用では3番線から1番線へ跨線橋・階段を通る可能性が高い。到着前に輪行袋を完全に持ち上げられる状態にし、降車後ただちに車内・ホーム案内で実番線を確認して移動する。買い物・トイレ・荷物整理は挟まず、接続待ちは前提にしない。
      - 五所川原13:24着後は13:45頃から立佞武多の館を見学し、約2時間を確保する。館は9:00〜19:00のため営業時間内に収まる。
      - 川部12:56発に乗れなかった場合は、当日に空席を確認できるときだけ全車指定席のリゾートしらかみ4号（川部14:43→五所川原15:09、指定席料金840円）を使う。空席・接続待ちは保証されない。
      - 見学後は16:00頃から予約済みのホテルサンルート五所川原へ向かい、チェックインと翌日の自走準備に充てる。チェックインは14:00〜24:00、チェックアウトは翌11:00である。到着日の主役以外のスポット、食事、自走区間は追加しない。
  - date: '2026-09-24'
    start: 五所川原
    finish: 竜飛
    self_riding: {distance_km: {min: 65, max: 70}}
    routes: [route.ryuhyo-line]
    transport: []
    transport_alternatives: []
    visits: [place.jusan-lake, place.komarizaki, place.nanatsutaki, place.chokandai, place.tappizaki]
    optional_visits: []
    food: [food.jusan-shijimi]
    stay: {preferred: [stay.tappi], fallback: []}
    notes:
      - 十三湖は湖としじみを20〜30分、小泊は昼食・補給と龍泊ラインへの切替地点として扱う。
      - 龍泊ラインは自走自体が主目的。固定停止は七ツ滝5〜10分、眺瞰台20〜30分のみとし、展望所をチェックリスト化しない。
      - 竜飛には自走から置く14〜15時台の到着目安とし、到着後に階段国道・龍飛崎を訪れる。予約済みの龍飛崎温泉 ホテル竜飛は15:00〜20:00にチェックインでき、翌10:00チェックアウトである。
  - date: '2026-09-25'
    start: 竜飛
    finish: むつ
    self_riding: {distance_km: {min: 22, max: 22}}
    routes: [route.tappi-okutsugaru]
    transport: [transport.hayabusa24, transport.shimokita3233d]
    transport_alternatives: []
    visits: [place.seikan-tunnel-museum]
    optional_visits: [place.seikan-honshu-portal]
    food: []
    stay: {preferred: [stay.mutsu], fallback: []}
    notes:
      - 青函トンネル記念館の体験坑道ツアーは予約済み。8:50に受付へ集合し、「じゃらんで予約した」と伝える。体験時間は9:00〜9:50で、ケーブルカーの出発便指定ではない。
      - オンラインでのキャンセル締切は9/24 17:00。遅れる場合または期限後の変更・取消は、青函トンネル記念館（0174-38-2301）へ直接連絡する。
      - 龍飛から青森へ自走せず、青函トンネル体験後に奥津軽いまべつまでだけ自走し、輪行で下北へ転場する。
      - 固定交通時刻は、はやぶさ24号 奥津軽いまべつ13:35→八戸14:15、快速しもきた 八戸15:14→下北16:47。夕方は無理に観光を詰めない。
      - 予約済みのむつパークホテルは15:00〜23:00にチェックインでき、翌10:00チェックアウトである。ロードバイクの安全な駐輪場所を希望する旨は予約コメントで伝達済みだが、施設からの回答は未確認である。
  - date: '2026-09-26'
    start: むつ
    finish: 大間
    self_riding: {distance_km: {min: 70, max: 75}}
    routes: [route.osorezan-oma]
    transport: []
    transport_alternatives: []
    visits: [place.osorezan, place.old-ohata-station, place.shimofuro]
    optional_visits: [place.oyakusen]
    food: []
    stay: {preferred: [stay.oma], fallback: []}
    notes:
      - むつで7時頃に朝食を取り、7:45〜8:00頃に出発する目安。6時台の強制出発にはしない。
      - 恐山は9時頃到着目安で2時間〜2時間15分を確保し、むつ市街へ戻らず薬研・大畑へ北抜けする。
      - 下風呂は14時頃到着目安で1.5時間程度。大畑漁港は自然に通過観察する。
      - 大間到着は自走から置く16:30〜17:00頃の目安。到着後に弱い港の下見は置かない。
      - 予約済みのサンホテル大間は15:00〜22:00にチェックインでき、翌10:00チェックアウトである。食事なしのため、夕食・翌朝の食事は別途確保する。
  - date: '2026-09-27'
    start: 大間
    finish: 函館
    self_riding: {distance_km: {min: 10, max: 20}}
    routes: []
    transport: [transport.oma-hakodate-0650]
    transport_alternatives: []
    visits: [place.mashumaru, place.old-soma-residence, place.hakodate-northern-peoples-museum, place.hakodate-west-port-observation]
    optional_visits: [place.sasaryu-dam, place.yachigashira-onsen, place.old-hakodate-public-hall, place.hakodate-city-museum, place.hakodate-literature-museum, place.motomachi-waterworks, place.old-kanamori-shop, place.hakodate-machizukuri-elevator, place.hakodate-haikara-go]
    food: [food.hakodate-shigechan-sushi, food.hakodate-goshoken, food.hakodate-california-baby, food.hakodate-fish-san-ko, food.hakodate-asari, food.hakodate-ozigi-brewing, food.hakodate-white-seed]
    stay: {preferred: [stay.hakodate], fallback: []}
    notes:
      - Primeは予約済みの第5便（大間06:50→函館08:20）で入る函館市街深掘り。青函トンネル→現役大間フェリー→旧青函連絡船という海峡交通の比較から、その交通を受けた港湾・商業都市函館と北方世界へつなぐ終章とする。既訪の函館山・五稜郭・赤レンガ倉庫周辺は理由に数えない。
      - 下船・自転車準備を08:20〜08:45、摩周丸と旧函館桟橋・可動橋周辺を09:00頃〜10:30頃、旧相馬家住宅を11:00頃〜12:00頃、昼食を12時台、北方民族資料館を13時台〜14時台、入舟・船入澗防波堤・函館どつく外周を14:30頃〜16時台の骨格とする。北方民族資料館は夕方へ後ろ倒しできる。時刻は宿決定後に微調整する実行目安であり、絶対時刻表ではない。
      - 摩周丸では実船、船橋、無線通信室、車両航送システムと、旧函館桟橋・可動橋主塔・岸壁を一体として見る。旧相馬家住宅では港湾商業が生んだ商人資本と住宅・都市空間の関係を、北方民族資料館では北方世界・交易・研究の窓口としての函館を読む。西部港湾地区は構内見学でなく、入舟漁港、船入澗防波堤、漁港と住宅地の境界、古い港湾土木、現役造船所外周と土地利用を自転車で観察する。
      - 昼食はシゲちゃんすしを当日営業確認型の第一候補とし、五島軒本店、カリフォルニア・ベイビー、その日の魚が良い寿司・海鮮店を代替とする。シゲちゃんすしの営業を前提に時刻を固定しない。珍しさではなく、函館で普通に良く、地元で食べる意味がある食事を選ぶ。
      - 16時台後半を目安に自転車パートを終了して宿へ戻り、自転車を格納した後は徒歩・市電等へ切り替える。夕食は海鮮なら魚さんこ、魚以外なら阿佐利本店を有力候補とし、固定する場合だけ魚さんこの予約を検討する。2軒目はozigi brewingを第一候補、White Seed等を代替とする。谷地頭温泉は差し替えOptionalであり、温泉・夕食・ビールを全て必須にはしない。
      - Optionalは近いからといって全て回収せず、笹流ダム、旧函館区公会堂、市立函館博物館、函館市文学館、元町配水場、旧金森洋物店、まちづくりセンターの手動式エレベーター、箱館ハイカラ號、谷地頭温泉、White Seed等から、その日の余力と導線に合うものだけ選ぶ。子ども向けが中心の函館公園こどものくに、函館市北洋資料館、一般見学施設としての函館どつく、スーパー魚長、旧イギリス領事館内部、当日食イベントはPrimeに戻さない。
