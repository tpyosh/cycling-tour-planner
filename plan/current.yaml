      - place.hama-re-utatsu
      - place.oya-coast
    food: []
    candidate_decisions:
      - {subject: place.minamisanriku-311-memorial, decision: on_hold, rationale: '開館日ではあるが時間コストが大きく、気仙沼震災遺構の16:00最終受付を優先するため保留する。'}
      - {subject: place.utatsu-ichthyosaur-display, decision: on_hold, rationale: 歌津魚竜は地域テーマとして認識するが、通常旅行者が短時間で強く回収できる対象としては弱く、current primeでは優先度を下げる。}
    stay: {preferred: [stay.kesennuma], fallback: []}
    notes:
      - 気仙沼市東日本大震災遺構・伝承館は4〜9月9:30〜17:00、最終受付16:00、自由見学約60分。最終受付の端を狙わず、敷地14:45到着、到着後の準備から受付まで10分を見て14:55以前の受付を目標とする。
      - 公式イベントの丸められたkm標を接続すると女川駅前から旧防災対策庁舎約58km、歌津約69km、大谷海岸約86km、気仙沼震災遺構約91km。独立した経路計算ではないためcyclingは90〜100km幅を維持し、宿確定後のラストマイルを含む正確な距離はユーザー確認待ちとする。
      - 14:45までの敷地到着、14:55までの受付は、9:30〜17:00・最終受付16:00・自由見学約60分という施設条件と矛盾しない。全線自走の出発時刻と休憩込み所要時間は、ユーザーが正確な距離・獲得標高・想定速度を確認してから決める。
      - 志津川では南三陸町震災復興祈念公園と旧防災対策庁舎を主軸にし、さんさん商店街は動線上で時間が許せば立ち寄る。
      - 遅延時はさんさん商店街、ハマーレ歌津、大谷海岸の観光滞在の順に削る。大谷海岸は補給・給水・トイレ利用を残してよい。重大遅延時のみ旧防災対策庁舎・祈念公園を10〜15分へ圧縮し、それでも最優先施設を守れない場合だけ例外的に通過する。
      - Google Maps再監査後も歌津に「絶対に止まるべき強い対象」は未確保。中華屋・飛上（4.0・約368件）は町中華・昼食候補として維持するが、歌津の主目的にはしない。
      - 食事は9/26と独立に、その土地で一食を使う価値、季節性、動線コスト、16:00締切との両立で評価する。この食事枠では現時点で強い候補を発見できていない。
      - 三陸沿岸道路・三陸自動車道へは進入しない。2026-09-11時点ではR398・R45を全線自走不能にする公表済みの全面通行止めまたは自転車通行禁止は確認されていないが、9/24と当日朝に道路規制と伝承館の臨時休館を再確認する。
      - BRT・路線バスへの輪行袋入り自転車の持込みは明示的に確認できていないため、確実な途中離脱手段として扱わない。

