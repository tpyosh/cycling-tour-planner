      - 最終日の候補は増やしすぎず、いわてTSUNAMIメモリアル、奇跡の一本松、タピック45を主軸にする。
      - Google Mapsでは、いわてTSUNAMIメモリアル4.6・約696件、奇跡の一本松4.3・約2,060〜2,100件、高田松原津波復興祈念公園4.3・約2,235件、タピック45 4.5・約63件で、現行の陸前高田クラスターを支持する。
      - BRT奇跡の一本松駅と大船渡線BRTそのものは、別の観光時間を取らず移動体験として回収する。
      - 時刻表上の採用候補は、奇跡の一本松12:19発BRT 1332F→気仙沼12:54着→14:18発334D→一ノ関15:40着→16:51発やまびこ64→東京19:28着→20:21発のぞみ91→名古屋21:56着。BRT輪行可否が未確認のため、確定・予約済みには変更しない。
      - 12:19発を逃した場合は、13:25発快速3336F→気仙沼13:57着→334Dを次善候補とする。334Dを逃した場合は、338D（気仙沼16:56発→一ノ関18:24着）→やまびこ66（18:38発→東京21:12着）→ひかり669（東京22:03発→名古屋23:49着）が時刻表上の後続候補。ただし、BRTは列車接続を保証せず、3336Fから334Dの21分と338Dからやまびこ66の14分は輪行携行時の公式標準乗換時間未確認である。
      - いわてTSUNAMIメモリアルは9:00〜17:00、最終入館16:30の通常案内。公式の60分モデルコースはあるが、自由見学の必須滞在時間として固定しない。12:19発までの3時間19分には、公園内移動、自転車走行、輪行準備を含む。

