schema_version: 1
status: working
recommendations:
  - 現在のPrimeは五所川原→竜飛→むつ→大間→函館と前進する5泊6日案である。
  - 固定交通時刻と、自走から置いた到着目安を区別して記録する。
days:
  - date: '2026-09-23'
    start: 名古屋
    finish: 五所川原
    self_riding: {distance_km: {min: 0, max: 0}}
    routes: []
    transport: [transport.nozomi288, transport.hayabusa7, transport.ouu-shin-aomori-kawabe, transport.gono-kawabe-goshogawara]
    transport_alternatives: []
    visits: [place.tachineputa]
    optional_visits: []
    food: []
    stay: {preferred: [stay.goshogawara], fallback: []}
    notes:
      - 固定交通は予約済みのぞみ288号（名古屋06:28→東京08:03）とはやぶさ7号（東京08:37→新青森11:51）。
      - はやぶさ7号は、輪行袋入りロードバイクでの乗換余裕を優先し、08:18発の短時間接続は採用しない。
      - 新青森12:20発の奥羽本線（弘前行）で川部12:49着、川部12:56発の五能線（深浦行）で五所川原13:24着。自転車は輪行袋に入れたまま乗り継ぐ。
      - 五所川原13:24着後は13:45頃から立佞武多の館を見学し、約2時間を確保する。館は9:00〜19:00のため営業時間内に収まる。
      - 見学後は16:00頃から予約済みのホテルサンルート五所川原へ向かい、チェックインと翌日の自走準備に充てる。チェックインは14:00〜24:00、チェックアウトは翌11:00である。到着日の主役以外のスポット、食事、自走区間は追加しない。
  - date: '2026-09-24'
    start: 五所川原
    finish: 竜飛
    self_riding: {distance_km: {min: 65, max: 70}}
    routes: [route.ryuhyo-line]
    transport: []
    transport_alternatives: []
    visits: [place.jusan-lake, place.komarizaki, place.nanatsutaki, place.chokandai, place.tappizaki]
    optional_visits: []
    food: [food.jusan-shijimi]
    stay: {preferred: [stay.tappi], fallback: []}
    notes:
      - 十三湖は湖としじみを20〜30分、小泊は昼食・補給と龍泊ラインへの切替地点として扱う。
      - 龍泊ラインは自走自体が主目的。固定停止は七ツ滝5〜10分、眺瞰台20〜30分のみとし、展望所をチェックリスト化しない。
      - 竜飛には自走から置く14〜15時台の到着目安とし、到着後に階段国道・龍飛崎を訪れる。予約済みの龍飛崎温泉 ホテル竜飛は15:00〜20:00にチェックインでき、翌10:00チェックアウトである。
  - date: '2026-09-25'
    start: 竜飛
    finish: むつ
    self_riding: {distance_km: {min: 22, max: 22}}
    routes: [route.tappi-okutsugaru]
    transport: [transport.hayabusa24, transport.shimokita3233d]
    transport_alternatives: []
    visits: [place.seikan-tunnel-museum]
    optional_visits: [place.seikan-honshu-portal]
    food: []
    stay: {preferred: [stay.mutsu], fallback: []}
    notes:
      - 青函トンネル記念館は9:00頃の体験坑道朝一便を想定する（予約可否は未確定）。
      - 龍飛から青森へ自走せず、青函トンネル体験後に奥津軽いまべつまでだけ自走し、輪行で下北へ転場する。
      - 固定交通時刻は、はやぶさ24号 奥津軽いまべつ13:35→八戸14:15、快速しもきた 八戸15:14→下北16:47。夕方は無理に観光を詰めない。
      - 予約済みのむつパークホテルは15:00〜23:00にチェックインでき、翌10:00チェックアウトである。ロードバイクの安全な駐輪場所を希望する旨は予約コメントで伝達済みだが、施設からの回答は未確認である。
  - date: '2026-09-26'
    start: むつ
    finish: 大間
    self_riding: {distance_km: {min: 70, max: 75}}
    routes: [route.osorezan-oma]
    transport: []
    transport_alternatives: []
    visits: [place.osorezan, place.old-ohata-station, place.shimofuro]
    optional_visits: [place.oyakusen]
    food: []
    stay: {preferred: [stay.oma], fallback: []}
    notes:
      - むつで7時頃に朝食を取り、7:45〜8:00頃に出発する目安。6時台の強制出発にはしない。
      - 恐山は9時頃到着目安で2時間〜2時間15分を確保し、むつ市街へ戻らず薬研・大畑へ北抜けする。
      - 下風呂は14時頃到着目安で1.5時間程度。大畑漁港は自然に通過観察する。
      - 大間到着は自走から置く16:30〜17:00頃の目安。到着後に弱い港の下見は置かない。
      - 予約済みのサンホテル大間は15:00〜22:00にチェックインでき、翌10:00チェックアウトである。食事なしのため、夕食・翌朝の食事は別途確保する。
  - date: '2026-09-27'
    start: 大間
    finish: 函館
    self_riding: {distance_km: {min: 0, max: 0}}
    routes: []
    transport: [transport.oma-hakodate-0650]
    transport_alternatives: [transport.oma-hakodate-1340]
    visits: [place.mashumaru]
    optional_visits: []
    food: []
    stay: {preferred: [stay.hakodate], fallback: []}
    notes:
      - Primeは第5便（大間06:50→函館08:20）。大間側は9/26夕方〜夜に大間崎・町・港・マグロ料理を回収し、翌朝まで残る追加価値を「7〜9時頃の大間漁港で延縄船の帰港・水揚げに遭遇できるか」に限定して評価した。水揚げは不確実で、外れた場合の午前は弱くなりやすい。
      - 第5便後は摩周丸を主役に、函館フェリーターミナル、港町側の港湾・物流、若松ふ頭、函館朝市、函館漁港、船入澗防波堤、函館どつく外縁を函館湾沿いの港湾・漁業・交通史として束ねる。既訪の函館山・五稜郭・赤レンガは理由に数えない。日曜休業の現役卸売市場を朝の主役には置かない。
      - 9/26に宿・飲食店・港周辺で自然な会話から、翌朝の延縄船の帰港・水揚げ見込み、休漁・悪天候でないことなど、第9便に替える明確に強い情報が得られた場合だけ再検討する。漁協への観光目的の照会、不確実な情報の取り込み、「最北端だから」「宿泊したから」「なんとなく朝の港が面白そう」といった理由では変更しない。情報がなければ第5便を維持する。
      - 第5便は自転車を含めて予約する。予約時に第9便への変更可否・変更期限・通常運賃か割引運賃かによる条件を確認し、直前変更できない商品で柔軟性を失う場合は、その交換条件を明示する。
      - 最終泊は未予約である。フェリーが通常運航なら函館を第一候補に直前確保し、フェリー欠航などで函館泊が不成立なら八戸などの実際に到達した都市で宿を確保する方針。函館・八戸の実在庫は未確認であり、確保できた宿に合わせて夜の行動を決める。
      - 函館泊が成立した場合は摩周丸を優先し、その後はベイエリア、夕食、夜の函館へ。函館山は必須にしない。
  - date: '2026-09-28'
    start: 函館
    finish: 名古屋
    self_riding: {distance_km: {min: 0, max: 0}}
    routes: []
    transport: [transport.hakodate-liner-morning, transport.hayabusa16, transport.nozomi41]
    transport_alternatives: []
    visits: []
    optional_visits: []
    food: [food.hakodate-morning-market]
    stay: {preferred: [], fallback: []}
    notes:
      - 函館朝市の後、固定交通時刻のはこだてライナー 函館08:50→新函館北斗09:09、はやぶさ16号 新函館北斗09:35→東京14:08、のぞみ41号 東京14:30→名古屋16:09を使う。
      - 名古屋17:00までの希望ゲートと、9/28中の名古屋帰着を満たす。すべて予約済みではない。
contingencies:
  - id: contingency.oma-ferry-cancellation
    name: 大間→函館フェリー欠航時の帰路
    trigger: 9/27当日に大間→函館フェリーが欠航した場合。
    date: '2026-09-27'
    transport: [transport.oma-hakodate-0650]
    transport_alternatives: [transport.hayabusa24, transport.shimokita3233d]
    impacts:
      - 函館は必須にせず、大間からむつ方面へ自走で南下する。
      - 9/28は大湊線・東北新幹線経由で名古屋へ帰る退路を使う。
    unresolved:
      - 実際に発動した場合の南下距離、当日の大湊線・新幹線接続、輪行可否を当日確認する。
  - id: contingency.oma-morning-fishing
    name: 大間漁港の強い現地情報による第9便への変更
    trigger: 9/26に大間で自然に得た具体的な情報から、翌朝の延縄船の帰港・水揚げを狙う価値が明確に高いと判断できた場合。
    date: '2026-09-27'
    transport: [transport.oma-hakodate-1340]
    transport_alternatives: [transport.oma-hakodate-0650]
    impacts:
      - 7〜9時頃を大間漁港の帰港・水揚げ観察に充て、第9便（大間13:40→函館15:10）で函館へ渡る。
      - 第5便で確保できる函館の午前〜午後の港湾・漁業・交通史の行動は短縮する。
    unresolved:
      - 漁協へ観光目的で操業予定を問い合わせず、強い現地情報が得られなければ発動しない。
