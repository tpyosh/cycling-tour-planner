      - food.kitakatsu-maguroya
      - food.kesennuma-bonito-swordfish
    candidate_decisions: []
    stay: {preferred: [stay.kesennuma], fallback: []}
    notes:
      - 朝の気仙沼魚市場では荷捌き、水揚げ、入港船、市場前の物流・漁業動線を具体的に確認する。
      - 海の市全体はGoogle Maps 3.8・約3,900件だが、複合施設の総合値で内部施設を一括評価しない。
      - 気仙沼シャークミュージアムは3.6・約2,156〜2,200件のためhigh_priority_recheck。初回監査では2024年の全面改装後にサメ産業・研究・大型標本・約15分シアターを扱うことを確認し、短時間立寄りとして30分を仮確保するが、★3本文・改装後の低評価本文・Google Maps投稿写真の監査が未完のため確定訪問にはしない。氷の水族館は3.8・約286件のためrecheck_required。
      - 氷の水族館は施設品質の警戒と、マイナス20度、氷漬けの魚、製氷文化というB級・ローカル適合度を分けて評価する。
      - 魚市場前〜港町〜鹿折の移動中に見える冷蔵庫、加工工場、トラック、漁船は副次的価値とする。特定工場を一般公開施設として扱わない。
      - 鶴亀食堂は4.4・約454件で、市場前、地域性、朝営業を含め9/26朝食の高優先度候補を維持する。
      - 食は戻り鰹、メカジキ、フカヒレ、モウカの星、サンマ、ホヤ、地魚寿司を個別に評価する。9月下旬は戻り鰹を特に高く評価し、メカジキは冬メカ最盛期より前であることを踏まえる。
      - 朝・昼・夜の最終店選定と9/26当日の実漁況は未確認。魚市場は06:40頃を標準到着とし、07:30を水揚げ・入港船等の主目的が不発だった場合の切替時刻とする。
      - 標準案では海の市売場、シャークミュージアム（30分仮枠）、氷の水族館、11時台の昼食後に、リアス・アーク美術館を12:40頃から約150分確保する。
      - 再監査中のシャークミュージアムと氷の水族館を両方外す場合は、海の市共用部の後にリアス・アーク美術館を10:00頃から先行して確保する短縮案へ切り替える。
      - 魚市場不発時は鶴亀食堂を最初に繰り上げ、次に08:00開館の海の市を繰り上げる。前夜に不発が判明した場合は07:00朝食開始も可能。
      - リアス・アーク美術館は通常の遅延時削減対象にせず、海の市内2施設と時間調整枠を先に削る。
      - 自転車実走距離と累積標高は未確認であり、既存の10〜20kmは今回の検証済み距離ではない。
      - 鶴亀食堂と北かつまぐろ屋は、旅行直前に臨時休業の有無を公式Web・SNSで再確認する。

