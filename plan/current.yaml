as_of: 2026-09-11
status: current_prime
maturity: provisional
history_note: これは現時点の最有力案であり、予約済み・確定旅程ではない。旧working planはGit履歴、比較した案A〜Dと前案の位置づけはresearch/candidate-evaluation.mdに残す。
change_reasons:
  - 抽象的な「港を見る」「街を見る」を、固有名詞と観察可能な物理対象へ置き換えた。
  - 雄勝港を単独候補から外し、玄昌石、雄勝硯、海産物直売所、震災後の沿岸拠点へ評価対象を分解した。
  - 気仙沼の港湾という表現を、気仙沼魚市場、荷捌き、水揚げ、入港船、海の市、シャークミュージアム、氷の水族館へ分解した。
  - 唐桑の対象を、神の倉の津波石、鮪立集落と唐桑御殿型住宅、御崎神社、巨釜・折石へ具体化した。
  - 各食事枠を独立に評価し、「翌日に温存する」という判断ロジックを禁止した。
  - 2026-09-11の設計原則監査を反映し、宿内保管・駐輪を予約条件および旅程リスクから除外した。目的地Tierの未分類・重複分類は新規Issueで追跡する。
  - 2026-09-10のGoogle Maps再監査を反映し、雄勝硯伝統産業会館、気仙沼シャークミュージアム、氷の水族館を採用確定扱いから再監査対象へ変更した。日別構成と訪問順は変更していない。
  - 2026-09-11の外部調査を反映し、9/25女川駅前〜気仙沼震災遺構の約91kmという概算根拠、伝承館の通常開館予定、14:45到着目標、直前の道路規制再確認を追加した。正確な距離・獲得標高・休憩込み所要時間とBRT・路線バスの輪行可否は未確認のため、全線自走は条件付きのままとし、日別構成と訪問先は変更していない。
  - 2026-09-11の帰路接続調査を反映し、9/28は奇跡の一本松12:19発の大船渡線BRT、気仙沼14:18発334D、一ノ関16:51発やまびこ64、東京20:21発のぞみ91を時刻表上の採用候補とした。BRT輪行可否と短い乗換の実運用余裕は未確認のため、確定・予約済みには変更していない。
recommendations:
  - 2026-09-11現在のcurrent prime。今後の実接続、道路、営業、宿泊、食事の検証で更新する前提で、確定・予約済みを意味しない。
  - 宿泊は9/23石巻、9/24女川、9/25・9/26気仙沼、9/27陸前高田とし、気仙沼のみ2連泊する。
  - 9/24は候補束ね、9/25は長距離都市間移動、9/27は唐桑の小候補束ねとして、自転車の価値を日ごとに区別する。
  - 時刻、最終受付、休館、道路状況、輪行可否、宿泊在庫、未確定の食事はissues.yamlで追跡する。
  - Google Maps再監査は旅程の自動ランキングではない。気仙沼シャークミュージアム、雄勝硯伝統産業会館、氷の水族館は現行動線に残すが、レビュー本文確認まで採用確定扱いにしない。
